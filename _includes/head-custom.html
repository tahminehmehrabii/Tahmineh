<!-- =========================================================
     Tahmineh Mehrabi — Custom Head
========================================================= -->

<!-- Google Analytics (only active if configured in _config.yml) -->
{% include head-custom-google-analytics.html %}


<!-- =========================
     FAVICON / APP ICON
========================= -->

<link
  rel="icon"
  type="image/jpeg"
  href="{{ '/Picture.jpg' | relative_url }}"
>

<link
  rel="apple-touch-icon"
  href="{{ '/Picture.jpg' | relative_url }}"
>


<!-- =========================
     BROWSER / MOBILE UI
========================= -->

<meta
  name="theme-color"
  content="#278ca8"
>

<meta
  name="color-scheme"
  content="light dark"
>


<!-- =========================
     PERFORMANCE HINTS
========================= -->

<link
  rel="preconnect"
  href="https://cdnjs.cloudflare.com"
  crossorigin
>

<link
  rel="dns-prefetch"
  href="//cdnjs.cloudflare.com"
>


<!-- =========================
     PROFILE IMAGE PRELOAD
========================= -->

<link
  rel="preload"
  as="image"
  href="{{ '/Picture.jpg' | relative_url }}"
>
